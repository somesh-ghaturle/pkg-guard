[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-guard"
version = "0.1.0"
description = "Block hallucinated & typosquatted package installs by AI coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
pkg-guard = "pkg_guard:main"

[tool.setuptools]
py-modules = ["pkg_guard"]
