[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slopsquat-guard"  # "pkg-guard" on PyPI is an unrelated project
version = "0.4.2"
description = "Block hallucinated & typosquatted package installs by AI coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["security", "supply-chain", "typosquatting", "slopsquatting", "ai-agents",
            "claude-code", "codex", "gemini-cli", "npm", "pypi", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/somesh-ghaturle/pkg-guard"
Issues = "https://github.com/somesh-ghaturle/pkg-guard/issues"

[project.scripts]
pkg-guard = "pkg_guard:main"

[tool.setuptools]
py-modules = ["pkg_guard"]
